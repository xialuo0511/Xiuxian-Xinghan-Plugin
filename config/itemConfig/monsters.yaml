      value_type: "atk"
      value: 1.5
      detailed_mechanics: "对生命值最低的目标造成 150% 攻击力的伤害。"
    talent:
      name: "处决"
      type: "passive"
      target: "self"
      effect: "execute_bonus"
      value: 0.5
      detailed_mechanics: "攻击生命值低于 50% 的目标时，暴击率提升 50%。"

- name: "铁甲巨龟"
  level: 6
  class: "妖兽"
  desc: "背负厚重甲壳的巨龟，防御力堪比城墙。"
  mechanics: "受到攻击时反弹伤害。"
  lore: "活了万年的老龟，其甲壳经过岁月的沉淀，已变得坚不可摧。它行动缓慢，但只要缩入壳中，便能抵御世间绝大多数的攻击。它性格温和，但若有人侵犯它的领地，它也会展现出惊人的力量，用沉重的身躯碾碎敌人。"
  base_stats: { attack: 100, defense: 400, health: 3000, resistance: 0.4, speed: 40, taunt: 500, element: "土", crit_rate: 0, crit_dmg: 1.0 }
  skills:
    basic:
