- name: "吞天巨蟒"
  level: 8
  class: "妖兽"
  desc: "体型遮天蔽日的远古巨蟒，相传有一丝龙族血脉。"
  mechanics: "喷吐剧毒烟雾，对全体敌人造成持续腐蚀伤害。"
  lore: "它是这片秘境的霸主之一，存活了数千年的老怪物。它的鳞片坚硬如铁，毒牙能轻易洞穿最坚固的铠甲。传说它张开巨口时，能将天空都吞下一角，故得名吞天。它极度贪婪，守护着无数珍宝，任何敢于觊觎的人都将成为它的腹中餐。"
  base_stats: { attack: 350, defense: 200, health: 8000, resistance: 0.3, speed: 80, taunt: 300, element: "木", crit_rate: 0.1, crit_dmg: 1.5 }
  skill:
    name: "毒雾弥漫"
    type: "damage"
    target: "all_enemies"
    value_type: "atk"
    value: 1.2
    debuff: { type: "poison_dot", target: "all_enemies", duration: 3, value: 0.05 } # 施加毒Debuff (每回合5%最大生命伤害，持续3回合)
    detailed_mechanics: "【毒雾弥漫】对敌方全体造成 120% 攻击力的伤害，并施加持续 3 回合的毒素，每回合造成 5% 最大生命值的伤害。"

