      type: "damage"
      target: "single_enemy"
      value_type: "def"
      value: 1.0
      detailed_mechanics: "对敌方单体造成防御力 100% 的伤害。"
    talent:
      name: "荆棘甲壳"
      type: "passive"
      target: "attacker"
      effect: "reflect"
      value: 0.2
      detailed_mechanics: "受到攻击时，反弹 20% 原始伤害给攻击者。"

