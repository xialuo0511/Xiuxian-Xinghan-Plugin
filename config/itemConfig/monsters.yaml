    type: "damage"
    target: "single_enemy"
    value_type: "atk"
    value: 1.8
    detailed_mechanics: "【无情剑气】对敌方单体造成 180% 攻击力的伤害。"

- name: "混元石魔"
  level: 7
  class: "妖兽"
  desc: "吸收了日月精华的万年石怪，也是本次试炼的首领。"
  mechanics: "引发大地震颤，对敌方全体造成毁灭性打击。"
  lore: "它是这片秘境的守护者，沉睡了不知多少岁月。它的身躯便是山脉，它的呼吸便是风雷。只有真正的强者，才能唤醒并战胜它，获得其体内的土之本源。作为首领，它的实力远超寻常妖兽，任何轻视它的人都将被碾为齑粉。"
  base_stats: { attack: 250, defense: 250, health: 5000, resistance: 0.25, speed: 60, taunt: 300, element: "土", crit_rate: 0.05, crit_dmg: 1.5 }
  skill:
    name: "地动山摇"
    type: "damage"
    target: "all_enemies"
    value_type: "atk"
    value: 1.0
    detailed_mechanics: "【地动山摇】对敌方全体造成 100% 攻击力的伤害。"

