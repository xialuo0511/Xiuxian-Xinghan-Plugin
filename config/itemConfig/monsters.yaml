  lore: "死于极寒之地的修仙者，因执念不散，魂魄与寒冰煞气融合而成的怪物。它们痛恨生者的体温，渴望将世间万物都冻结在永恒的寂静之中。其吐息能穿透灵力护盾，直冻神魂。"
