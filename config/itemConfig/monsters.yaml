- name: "混元石魔"
  level: 7
  class: "妖兽"
  desc: "吸收了日月精华的万年石怪，也是本次试炼的首领。"
  mechanics: "具备毁灭性的群体打击能力。"
  lore: "它是这片秘境的守护者，沉睡了不知多少岁月。它的身躯便是山脉，它的呼吸便是风雷。只有真正的强者，才能唤醒并战胜它，获得其体内的土之本源。作为首领，它的实力远超寻常妖兽，任何轻视它的人都将被碾为齑粉。"
