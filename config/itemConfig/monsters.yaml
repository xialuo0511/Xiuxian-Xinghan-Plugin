  skill:
    name: "毒刺鞭挞"
    type: "damage"
    target: "single_enemy"
    value_type: "atk"
    value: 1.2
    detailed_mechanics: "【毒刺鞭挞】对敌方单体造成 120% 攻击力的伤害。"

# --- 中级怪物 ---
