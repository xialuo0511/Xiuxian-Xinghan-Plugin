# 怪物定义文件
# 结构与星魂一致，以便统一处理
# skills: 技能组 (basic, talent, ultimate)

# --- 低级怪物 ---
- name: "石傀儡"
  level: 1
  class: "妖兽"
  desc: "由山岩碎石凝聚而成的傀儡，动作迟缓但防御惊人。"
  mechanics: "只会进行简单的普通攻击。"
  lore: "上古战场遗留的残垣断壁，受天地灵气侵染日久，竟生出灵智。它们没有痛觉，不知疲倦，只会忠实地守护着这片废墟。虽然攻击手段单一，但那坚如磐石的身躯往往让修仙者感到头痛不已。"
  base_stats: { attack: 70, defense: 120, health: 800, resistance: 0.15, speed: 50, taunt: 100, element: "土", crit_rate: 0, crit_dmg: 1.5 }
  skills:
    basic:
      name: "碎石击"
      type: "damage"
      target: "single_enemy"
      value_type: "atk"
      value: 1.0
      detailed_mechanics: "对敌方单体造成 100% 攻击力的伤害。"

- name: "藤蔓精"
  level: 1
  class: "妖兽"
  desc: "潜伏在丛林深处的变异藤蔓，擅长偷袭。"
  mechanics: "只会进行简单的普通攻击。"
  lore: "原本只是普通的野藤，因吸食了过多误入歧途的旅人精血而妖化。它们善于伪装成无害的植物，一旦猎物靠近，便会瞬间暴起，用带刺的藤条将猎物死死缠住。"
  base_stats: { attack: 90, defense: 80, health: 700, resistance: 0.1, speed: 90, taunt: 100, element: "木", crit_rate: 0.05, crit_dmg: 1.5 }
  skills:
    basic:
      name: "毒刺鞭挞"
      type: "damage"
      target: "single_enemy"
      value_type: "atk"
      value: 1.2
      detailed_mechanics: "对敌方单体造成 120% 攻击力的伤害。"

# --- 中级怪物 ---
- name: "深寒怨灵"
  level: 3
  class: "妖兽"
  desc: "集聚在极阴之地的怨念集合体，散发着刺骨寒意。"
  mechanics: "只会进行简单的普通攻击。"
  lore: "死于极寒之地的修仙者，因执念不散，魂魄与寒冰煞气融合而成的怪物。它们痛恨生者的体温，渴望将世间万物都冻结在永恒的寂静之中。其吐息能穿透灵力护盾，直冻神魂。"
  base_stats: { attack: 150, defense: 90, health: 1000, resistance: 0.1, speed: 100, taunt: 100, element: "水", crit_rate: 0.1, crit_dmg: 1.5 }
  skills:
    basic:
      name: "寒霜吐息"
      type: "damage"
      target: "all_enemies"
      value_type: "atk"
      value: 0.7
      detailed_mechanics: "对敌方全体造成 70% 攻击力的伤害。"

- name: "烈焰之魂"
  level: 3
  class: "妖兽"
  desc: "在地火熔岩中诞生的元素生物，性情狂暴。"
  mechanics: "只会进行简单的普通攻击。"
  lore: "地心熔岩喷发时偶尔诞生的低阶火灵，虽无神智，却有着焚尽一切的本能。它们就像是一团行走的烈火，所过之处焦土一片。普通的修仙者若无避火法宝，根本无法近身。"
  base_stats: { attack: 180, defense: 70, health: 850, resistance: 0.05, speed: 115, taunt: 100, element: "火", crit_rate: 0.15, crit_dmg: 1.5 }
  skills:
    basic:
      name: "烈火撞击"
      type: "damage"
      target: "single_enemy"
      value_type: "atk"
      value: 1.5
      detailed_mechanics: "对敌方单体造成 150% 攻击力的伤害。"

# --- 高级怪物 (精英) ---
- name: "锐金剑侍"
  level: 5
  class: "妖兽"
  desc: "古代剑冢中守护名剑的金属傀儡，剑术高超。"
  mechanics: "普攻附带破甲效果。"
  lore: "不知是何方大能留下的守墓机关，通体由精金打造，内刻高深剑阵。经过数千年的岁月洗礼，剑阵已生出剑灵，使其能自动演练剑法。它的每一击都蕴含着单纯而极致的杀意，专破护身罡气。"
  base_stats: { attack: 220, defense: 130, health: 1200, resistance: 0.1, speed: 125, taunt: 100, element: "金", crit_rate: 0.2, crit_dmg: 1.7 }
  skills:
    basic:
      name: "无情剑气"
      type: "damage"
      target: "single_enemy"
      value_type: "atk"
      value: 1.0
      detailed_mechanics: "对敌方单体造成 100% 攻击力的伤害。"
    talent:
      name: "剑心通明"
      type: "passive"
      target: "self"
      effect: "penetrate"
      value: 0.3
      detailed_mechanics: "攻击无视目标 30% 防御。"

- name: "炽火妖莲"
  level: 5
  class: "妖兽"
  desc: "生长在熔岩湖畔的妖异莲花，花瓣如火焰般跳动。"
  mechanics: "攻击附带灼烧效果。"
  lore: "原本是吸食地火之力的灵植，因吞噬了过多的妖兽精血而堕落。它扎根于虚空，每一片花瓣都蕴含着足以融金化铁的高温。它的美丽是致命的诱惑，靠近它的人往往会在不知不觉中化为灰烬。"
  base_stats: { attack: 280, defense: 100, health: 2500, resistance: 0.2, speed: 90, taunt: 100, element: "火", crit_rate: 0.2, crit_dmg: 1.6 }
  skills:
    basic:
      name: "火莲弹"
      type: "damage"
      target: "single_enemy"
      value_type: "atk"
      value: 1.0
      detailed_mechanics: "对敌方单体造成 100% 攻击力的伤害。"
    talent:
      name: "热浪滚滚"
      type: "passive"
      target: "all_enemies"
      effect: "burn_aura"
      value: 0.05
      detailed_mechanics: "回合开始时，对所有敌人造成 5% 攻击力的微量火焰伤害。"

- name: "雷灵鸟"
  level: 6
  class: "妖兽"
  desc: "沐浴雷电而生的灵鸟，速度极快，常伴有雷鸣。"
  mechanics: "速度越快，伤害越高。"
  lore: "生于九天之上的雷云之中，以雷电为食。它的羽毛如同闪电般耀眼，飞行时会发出震耳欲聋的雷鸣声。它的速度极快，寻常修士根本无法捕捉到它的身影。它性格暴躁，一旦被激怒，便会引来漫天雷霆，将敌人化为焦炭。"
  base_stats: { attack: 200, defense: 80, health: 1500, resistance: 0.1, speed: 140, taunt: 100, element: "金", crit_rate: 0.25, crit_dmg: 1.5 }
  skills:
    basic:
      name: "千鸟齐鸣"
      type: "damage"
      target: "all_enemies"
      value_type: "atk"
      value: 0.6
      detailed_mechanics: "对敌方全体造成 60% 攻击力的伤害。"
    talent:
      name: "雷霆急速"
      type: "passive"
      target: "self"
      effect: "speed_dmg_up"
      value: 0.01
      detailed_mechanics: "每 1 点速度提升 1% 造成的伤害。"

- name: "暗影刺客"
  level: 6
  class: "妖兽"
  desc: "隐藏在阴影中的杀手，出手必见血。"
  mechanics: "对低血量目标造成额外伤害。"
  lore: "曾是某个古老杀手组织的成员，死后化为怨灵，继续执行着生前的任务。它没有实体，能自由穿梭于阴影之中。它最喜欢在敌人最虚弱的时候发动致命一击，让人防不胜防。它的匕首涂有剧毒，见血封喉。"
  base_stats: { attack: 300, defense: 60, health: 1200, resistance: 0.05, speed: 130, taunt: 50, element: "水", crit_rate: 0.4, crit_dmg: 2.0 }
  skills:
    basic:
