    talent:
      name: "无坚不摧"
      type: "passive"
      target: "self"
      effect: "penetrate"
      value: 0.2
      detailed_mechanics: "攻击时无视目标 20% 防御力。"
    ultimate:
      name: "太白庚金斩"
      type: "damage"
      target: "single_enemy"
