  eventKey: "wanxiang_tianji_2025_10"
  base_stats: { attack: 180, defense: 100, health: 1000, resistance: 0.1, speed: 115, taunt: 100, element: "金", crit_rate: 0.2, crit_dmg: 1.6, max_energy: 120 }
