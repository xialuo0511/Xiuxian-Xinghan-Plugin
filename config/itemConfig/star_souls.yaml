# 星魂定义文件
# base_stats: 基础属性
# skills: 技能组 (basic, talent, ultimate)
# lore: 详细图鉴中的背景故事与设定

- name: "剑魂·庚金"
  class: "活动"
  desc: "金之法则凝聚的锐利战魂，主宰杀伐。"
  mechanics: "高爆发单体输出，终结技可造成毁灭性打击。"
  lore: "上古剑修遗留的一缕杀伐剑意，经万载庚金之气孕育而生。它没有实体，唯有一股刺破苍穹的锐气。传闻得此战魂者，剑出无回，无坚不摧。其绝技「太白庚金斩」引动太白星力，瞬息之间可取敌首级，造成毁灭性打击。"
  eventKey: "wanxiang_tianji_2025_10"
  base_stats: { attack: 195, defense: 100, health: 1200, resistance: 0.1, speed: 125, taunt: 100, element: "金", crit_rate: 0.35, crit_dmg: 1.6, max_energy: 120, energy_regen: 25 }
  skills:
    basic:
      name: "锐金指"
      type: "damage"
      target: "single_enemy"
      value_type: "atk"
      value: 1.1
      detailed_mechanics: "对敌方单体造成 110% 攻击力的金属性伤害。"
    talent:
      name: "疾风剑意" # 新天赋名称
      type: "passive"
      target: "self"
      effect: "speed_up_on_action" # 新天赋效果
      value: 0.1 # 10%
      detailed_mechanics: "每次行动时，自身速度提高 10%。"
    ultimate:
      name: "太白庚金斩"
      type: "damage"
      target: "single_enemy"
      value_type: "atk"
      value: 3.0
      energy_cost: 120
      detailed_mechanics: "消耗120点能量，对敌方单体造成 300% 攻击力的巨额金属性伤害。"

- name: "盾灵·戊土"
  class: "活动"
  desc: "土之法则凝聚的厚重战魂，不动如山。"
  mechanics: "强力护盾辅助，天赋提供全队减伤。"
  lore: "生于极西之地的万年戊土之精，性情温厚沉稳。它象征着大地的宽容与承载，能将脚下的每一寸土地化为坚不可摧的屏障。其绝技「不动明王阵」能沟通大地脉动，为所有队友提供坚实的护盾，任凭风吹雨打，我自岿然不动。"
  eventKey: "wanxiang_tianji_2025_10"
  base_stats: { attack: 80, defense: 200, health: 1850, resistance: 0.25, speed: 70, taunt: 300, element: "土", crit_rate: 0.05, crit_dmg: 1.5, max_energy: 100, energy_regen: 15 }
  skills:
    basic:
      name: "地裂波"
      type: "damage"
      target: "all_enemies"
      value_type: "def"
      value: 0.65
      detailed_mechanics: "对敌方全体造成基于防御力 65% 的土属性伤害。"
    talent:
      name: "大地守护"
      type: "passive"
      target: "self"
      effect: "taunt_up_damage_reduce"
      value: 0.1 # 减伤10%
      initial_energy: 50 # 初始能量
      detailed_mechanics: "大幅提高受到攻击的概率，受到的伤害降低10%。战斗开始时恢复50%的能量。"
    ultimate:
      name: "不动如山"
      type: "shield"
      target: "all_allies"
      value_type: "def"
      value: 1.8
      energy_cost: 70
      self_extra_shield_ratio: 0.5
      detailed_mechanics: "消耗70点能量，为我方全体施加 180% 防御力的护盾，自身额外获得该护盾值的 50%。"

- name: "药仙·乙木"
  class: "活动"
  desc: "木之法则凝聚的生机战魂，枯木逢春。"
  mechanics: "群体治疗专家，天赋能持续滋养队友。"
  lore: "曾是百草园中一株得道的灵芝，感悟乙木长生之理化形。它所过之处，百花盛开，枯木逢春。它不喜争斗，只愿悬壶济世。其绝技「青帝长生诀」借来东方青帝之生机，能瞬间治愈重伤的队友，由于它是灵体，甚至能修复受损的神魂。"
  eventKey: "wanxiang_tianji_2025_10"
  base_stats: { attack: 100, defense: 120, health: 1350, resistance: 0.15, speed: 100, taunt: 100, element: "木", crit_rate: 0.1, crit_dmg: 1.5, max_energy: 110 }
  skills:
    basic:
      name: "飞叶"
      type: "damage"
      target: "single_enemy"
      value_type: "atk"
      value: 0.8
      detailed_mechanics: "对敌方单体造成 80% 攻击力的木属性伤害。"
    talent:
      name: "生生不息"
      type: "passive"
      target: "lowest_hp_ally_and_self"
      effect: "heal_turn_end"
      value_type: "max_hp"
      value: 0.1
      detailed_mechanics: "回合结束时，为自身以及生命最低的友方单位恢复 10% 生命上限的生命值。"
    ultimate:
      name: "青帝长生诀"
      type: "heal"
      target: "all_allies"
      value_type: "max_hp"
      value: 0.8
      energy_cost: 115
      detailed_mechanics: "消耗115点能量，为我方全体恢复 80% 生命上限的生命值。"

- name: "咒师·壬水"
  class: "活动"
  desc: "水之法则凝聚的玄冥战魂，上善若水。"
  mechanics: "群体控制与削弱，终结技可冻结敌人。"
  lore: "诞生于北冥深海的幽寒之灵，掌握着水的变幻莫测。水可至柔滋养万物，亦可至刚席卷天下。咒师深谙此道，平时静若处子，动则如怒海狂涛。其绝技「弱水三千」能召唤来自九幽的弱水，冲击敌方全体，且弱水沉重，一旦沾染，难以摆脱。"
  eventKey: "wanxiang_tianji_2025_10"
  base_stats: { attack: 140, defense: 100, health: 1300, resistance: 0.1, speed: 105, taunt: 100, element: "水", crit_rate: 0.1, crit_dmg: 1.5, max_energy: 120 }
  skills:
    basic:
      name: "凝冰刺"
      type: "damage"
      target: "single_enemy"
      value_type: "atk"
      value: 1.0
      detailed_mechanics: "对敌方单体造成 100% 攻击力的水属性伤害。"
    talent:
      name: "寒气侵袭"
      type: "passive"
      target: "attacker"
      effect: "counter_poison"
      value: 0.05
      prob: 0.3
      detailed_mechanics: "受到攻击时，有 30% 概率为敌方施加两回合【毒水】效果（回合开始受5%当前生命伤害）。"
    ultimate:
      name: "弱水三千"
      type: "damage"
