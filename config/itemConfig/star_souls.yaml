# 星魂定义文件
# base_stats: 基础属性
# skill: 战斗技能逻辑配置
#   type: damage(伤害) / heal(治疗) / shield(护盾)
#   target: single_enemy(单体敌方) / all_enemies(全体敌方) / lowest_hp_ally(最低血量友方) / all_allies(全体友方)
#   value_type: atk(攻击力百分比) / def(防御力百分比) / max_hp(最大生命值百分比)
#   value: 倍率 (如 1.5 代表 150%)

