      debuff: { type: "curse_water", target: "all_enemies", duration: 2, value: 0 }
      detailed_mechanics: "消耗120点能量，对敌方全体造成 120% 攻击力的伤害，并施加【诅咒之水】（减速15%，回合结束50%概率晕眩）。"

