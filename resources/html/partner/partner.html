<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>仙侣信息</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <style>
      @font-face {
          font-family: 'HYWenHei';
          src: url('https://sf6-cdn-tos.douyinstatic.com/obj/ies-music/1655954624223431/HYWenHei-85W.ttf');
      }

      body {
          font-family: 'HYWenHei', sans-serif;
          background-image: url("https://gimg2.baidu.com/image_search/src=http%3A%2F%2Fwww.pptbz.com%2Fpptpic%2FUploadFiles_6909%2F201204%2F2012041411155948.jpg&refer=http%3A%2F%2Fwww.pptbz.com&app=2002&size=f9999,10000&q=a80&n=0&g=0n&fmt=auto?sec=1672502400&t=a82f3d73e72c1c385a4e58b350438f36");
          background-size: cover;
          background-position: center;
          background-repeat: no-repeat;
          display: flex; /* 【布局修正】使用flex布局使卡片居中 */
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          padding: 16px;
      }

      .main-container {
          width: 700px; /* 稍微加宽以容纳更多信息 */
          background: rgba(255, 255, 255, 1); /* 【风格统一】深色半透明背景 */
          border-radius: 16px;
          border: 1px solid rgba(226, 196, 181, 0.4);
          box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
          padding: 24px;
          color: #f3e5d8; /* 基础文字颜色 */
      }

      .avatar {
          width: 90px;
          height: 90px;
          border-radius: 50%;
          border: 3px solid #e2c4b5;
          box-shadow: 0 0 15px rgba(255, 220, 180, 0.5); /* 金色辉光 */
      }

      .heart-lock {
          width: 50px;
          height: 50px;
          color: #ef4444;
          filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.8));
          align-self: center;
      }

      .stats-grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 12px;
          background: rgba(0, 0, 0, 0.3);
          padding: 16px;
          border-radius: 8px;
      }

      /* 【进度条优化】 */
      .progress-bar-container {
          position: relative;
          width: 100%;
          height: 24px;
      }
      .progress-bar {
          background-color: rgba(0, 0, 0, 0.4);
          border: 1px solid rgba(226, 196, 181, 0.3);
          border-radius: 12px;
          overflow: hidden;
          height: 100%;
      }
      .progress-filler {
          background: linear-gradient(90deg, #f59e0b, #ef4444);
          height: 100%;
          border-radius: 12px;
          transition: width 0.5s ease-in-out;
          box-shadow: inset 0 1px 2px rgba(255,255,255,0.3);
      }
      .progress-text {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          display: flex;
          justify-content: center;
          align-items: center;
          font-size: 14px;
          font-weight: bold;
          color: #fff;
          text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      }

      .coin-icon {
          width: 28px; height: 28px; color: #f59e0b;
      }
      .section-divider {
          border-color: rgba(226, 196, 181, 0.3);
      }
  </style>
</head>

<body>
<div id="capture" class="main-container">
  <div class="flex items-start justify-between">
    <div class="text-center space-y-2">
      <img class="avatar" src="https://q1.qlogo.cn/g?b=qq&s=0&nk={{user.id}}" alt="User Avatar">
      <p class="font-semibold text-lg">{{user.名号}}</p>
    </div>
    <div class="heart-lock mt-8">
      <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>
    <div class="text-center space-y-2">
      <img class="avatar" src="https://q1.qlogo.cn/g?b=qq&s=0&nk={{partner.id}}" alt="Partner Avatar">
      <p class="font-semibold text-lg">{{partner.名号}}</p>
    </div>
  </div>

  <div class="my-6 border-t section-divider"></div>

  <div class="space-y-4">
    <div class="stats-grid">
      <div class="text-center">
        <p class="text-sm text-gray-400">情缘等级</p>
        <p class="text-xl font-bold text-amber-400">{{stats.levelName}} (Lv.{{stats.level}})</p>
      </div>
      <div class="text-center">
        <p class="text-sm text-gray-400">道侣币</p>
        <div class="flex items-center justify-center space-x-1">
          <div class="coin-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm.707-10.293a1 1 0 00-1.414-1.414l-3 3a1 1 0 000 1.414l3 3a1 1 0 001.414-1.414L9.414 11H13a1 1 0 100-2H9.414l1.293-1.293z" clip-rule="evenodd"></svg>
          </div>
          <p class="text-xl font-bold text-amber-400">{{stats.coins}}</p>
        </div>
      </div>
    </div>

    <div>
      <div class="progress-bar-container">
        <div class="progress-bar">
          <div class="progress-filler" style="width: {{progress.percentage}}%;"></div>
        </div>
        <div class="progress-text">
          亲密度: {{stats.intimacy}} / {{progress.needed}}
        </div>
      </div>
    </div>
  </div>

  {{if stats.marriage_date}}
  <div class="mt-6 text-center text-xs text-gray-400 border-t section-divider pt-2">
    <p>结缘于：{{stats.marriage_date}}</p>
  </div>
  {{/if}}
</div>
</body>
</html>
