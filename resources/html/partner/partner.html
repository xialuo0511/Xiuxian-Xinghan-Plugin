<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>仙侣信息</title>
  <style>
      /* --- 字体定义 --- */
      @font-face {
          font-family: "tttgbnumber";
          src: url("file:///{{pluResPath}}/font/tttgbnumber.ttf");
      }

      @font-face {
          font-family: "NZBZ";
          src: url("file:///{{pluResPath}}/font/NZBZ.TTF");
      }

      /* --- 基础样式 --- */
      body {
          width: 700px;
          margin: 0;
          padding: 20px;
          background: linear-gradient(135deg, #4a4a4a, #2c2c2c);
          font-family: "tttgbnumber", sans-serif;
          color: #4a2c1a;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          box-sizing: border-box;
      }

      .panel-container {
          display: flex;
          flex-direction: column;
          gap: 15px;
          width: 100%;
      }

      .card-base {
          background: rgba(253, 250, 245, 0.88);
          backdrop-filter: blur(8px);
          -webkit-backdrop-filter: blur(8px);
          border: 2px solid #a88763;
          border-radius: 12px;
          box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
          padding: 20px;
      }

      .header-section {
          display: flex;
          align-items: center;
          justify-content: space-around;
      }

      .partner-info {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 10px;
      }

      .avatar {
          width: 90px;
          height: 90px;
          border-radius: 50%;
          border: 3px solid #c8a87e;
      }

      .partner-name {
          font-family: "NZBZ", sans-serif;
          font-size: 24px;
          color: #6a3906;
      }

      .heart-lock {
          width: 50px;
          height: 50px;
          color: #ef4444;
          filter: drop-shadow(0 0 5px rgba(239, 68, 68, 0.7));
      }

      .section-title {
          font-family: "NZBZ", sans-serif;
          font-size: 22px;
          text-align: center;
          color: #6a3906;
          margin-bottom: 15px;
          border-bottom: 1px solid #d2b48c;
          padding-bottom: 8px;
      }

      .stats-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 10px 20px;
          font-size: 16px;
      }

      .stat-item {
          display: flex;
      }

      .stat-label {
          font-weight: 600;
          color: #7a5533;
          width: 100px;
          flex-shrink: 0;
      }

      .stat-value {
          color: #4a2c1a;
          font-weight: bold;
      }

      .progress-title {
          font-size: 16px;
          font-weight: 600;
          color: #7a5533;
          margin-bottom: 5px;
      }

      .progress-bar-container {
          width: 100%;
          height: 22px;
          background-color: rgba(0, 0, 0, 0.1);
          border-radius: 11px;
          position: relative;
      }

      .progress-bar {
          height: 100%;
          border-radius: 11px;
          transition: width 0.5s ease-in-out;
          background: linear-gradient(to right, #f59e0b, #ef4444);
      }

      .progress-text {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          line-height: 22px;
          text-align: center;
          color: white;
          font-size: 13px;
          font-weight: bold;
          text-shadow: 1px 1px 1px #000;
      }

      .footer {
          text-align: center;
          font-size: 12px;
          color: #fff;
          text-shadow: 1px 1px 2px #000;
          margin-top: 5px;
      }
  </style>
</head>

<body>
<div class="panel-container" id="capture">

  <div class="card-base header-section">
    <div class="partner-info">
      <img class="avatar" src="https://q1.qlogo.cn/g?b=qq&s=0&nk={{user.id}}" alt="User Avatar">
      <p class="partner-name">{{user.名号}}</p>
    </div>
    <div class="heart-lock">
      <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>
    <div class="partner-info">
      <img class="avatar" src="https://q1.qlogo.cn/g?b=qq&s=0&nk={{partner.id}}" alt="Partner Avatar">
      <p class="partner-name">{{partner.名号}}</p>
    </div>
  </div>

  <div class="card-base">
    <div class="section-title">情缘仙途</div>

    <div class="stats-grid">
      <div class="stat-item">
        <span class="stat-label">情缘等级:</span>
        <span class="stat-value">{{stats.levelName}} (Lv.{{stats.level}})</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">道侣币:</span>
        <span class="stat-value">{{stats.coins}}</span>
      </div>
      {{if stats.marriage_date}}
      <div class="stat-item" style="grid-column: 1 / -1;">
        <span class="stat-label">结缘于:</span>
        <span class="stat-value">{{stats.marriage_date}}</span>
      </div>
      {{/if}}
    </div>

    <div class="mt-4">
      <div class="progress-title">亲密度</div>
      <div class="progress-bar-container">
        <div class="progress-bar" style="width: {{progress.percentage}}%;"></div>
        <div class="progress-text">{{stats.intimacy}} / {{progress.needed}}</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
