<!DOCTYPE html>
<html>

<head>
    <meta content="text/html;charset=utf-8" http-equiv="content-type" />
    <link href="#" rel="shortcut icon" />
    <style>
        @font-face {
            font-family: "tttgbnumber";
            src: url("file:///{{pluResPath}}/font/tttgbnumber.ttf");
        }

        @font-face {
            font-family: "NZBZ";
            src: url("file:///{{pluResPath}}/font/NZBZ.TTF");
        }

        body {
            width: 900px;
            margin: 0;
            padding: 20px;
            /* 深色修仙背景 */
            background-color: #0f0f0f;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
            url('file:///{{pluResPath}}/img/background.jpg');
            background-size: cover;
            background-attachment: fixed;
            font-family: "tttgbnumber", sans-serif;
            color: #F5E6D3;
        }

        .container {
            /* 整体容器增加边距 */
            padding: 10px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            padding: 20px 0;
        }

        /* 标题背景装饰 */
        .header::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #FFD700, transparent);
        }

        .title {
            font-family: "NZBZ", sans-serif;
            font-size: 48px;
            color: #FFD700;
            margin: 0;
            letter-spacing: 4px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.3);
            background: linear-gradient(180deg, #FFD700 30%, #ff8c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: #bfa588;
            margin-top: 10px;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        .skin-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding: 10px;
        }

        .skin-card {
            /* 卡片高级磨砂质感 */
            background: rgba(30, 30, 35, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        /* 装备中状态 */
        .skin-card.active {
            border: 1px solid #FFD700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.15);
            background: linear-gradient(160deg, rgba(40, 30, 20, 0.8), rgba(30, 25, 25, 0.8));
        }

        /* 选中标记角标 */
        .active-badge {
            position: absolute;
            top: 0;
            left: 0;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            font-weight: bold;
            font-size: 12px;
            padding: 4px 10px;
            border-bottom-right-radius: 8px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .preview-area {
            /* 缩小预览图高度 */
            height: 160px;
            background-color: #1a1a1a;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 预览背景模式 */
        .preview-mini-layout {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.85;
            transition: transform 0.3s;
        }

        .skin-card:hover .preview-mini-layout {
            transform: scale(1.05);
            opacity: 1;
        }

        .info-area {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skin-name {
            font-family: "NZBZ", sans-serif;
            font-size: 20px;
            color: #E8E8E8;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .skin-card.active .skin-name {
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .badges {
            display: flex;
            gap: 5px;
        }

        .badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #aaa;
            line-height: 14px;
            height: fit-content;
        }

        .badge.limit {
            border-color: #ff4d4f;
            color: #ff4d4f;
            background: rgba(255, 77, 79, 0.1);
        }

        .badge.default {
            border-color: #888;
            color: #888;
        }

        .skin-desc {
            font-size: 12px;
            color: #888;
            line-height: 1.5;
            /* 描述文字限制行数 */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: auto;
            /* Push footer down */
        }

        .skin-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 12px;
            font-size: 12px;
            color: #555;
        }

        .owned-tag {
            font-size: 11px;
            color: #52c41a;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .owned-tag svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
        }
    </style>
</head>

<body>
    <div class="container" id="capture">
        <div class="header">
            <h1 class="title">锦衣华服</h1>
            <div class="subtitle">当前收藏 {{ownedSkins.length}} / {{allSkins.length}} 珍品</div>
        </div>

        <div class="skin-grid">
            {{each allSkins skin}}
            <div class="skin-card {{if skin.isCurrent}}active{{/if}}">
                {{if skin.isCurrent}}
                <div class="active-badge">当前佩戴</div>
                {{/if}}

                <div class="preview-area">
                    <!-- 预览背景：优先使用 previewBg，或者 fallback 颜色 -->
                    <div class="preview-mini-layout"
                        style="{{if skin.previewBg}}background-image: url('{{skin.previewBg}}'){{else}}background: {{skin.colors.background || 'linear-gradient(45deg, #333, #444)'}}{{/if}};">
                    </div>
                </div>

                <div class="info-area">
                    <div class="header-row">
                        <div class="skin-name">{{skin.name}}</div>
                        <div class="badges">
                            {{if skin.eventKey}}
                            <span class="badge limit">限定</span>
                            {{/if}}
                            {{if skin.isDefault}}
                            <span class="badge default">默认</span>
                            {{/if}}
                        </div>
                    </div>

                    <div class="skin-desc">{{skin.desc}}</div>

                    <div class="skin-meta">
                        <div class="skin-id">ID: {{skin.id}}</div>
                        {{if skin.isOwned}}
                        <div class="owned-tag">
                            <svg viewBox="0 0 1024 1024">
                                <path
                                    d="M912 190h-69.9c-9.8 0-19.1 4.5-25.1 12.2L404.7 724.5 207 474a32 32 0 0 0-25.1-12.2H112c-6.7 0-10.4 7.7-6.3 12.9l273.9 347c12.8 16.2 37.4 16.2 50.3 0l488.4-618.9c4.1-5.1 0.4-12.8-6.3-12.8z">
                                </path>
                            </svg>
                            已拥有
                        </div>
                        {{/if}}
                    </div>
                </div>
            </div>
            {{/each}}
        </div>

        <div class="footer">
            发送 #切换皮肤 + 皮肤名称 即可更换主题
        </div>
    </div>
</body>

</html>
