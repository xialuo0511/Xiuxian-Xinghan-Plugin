<!DOCTYPE html>
<html>

<head>
    <meta content="text/html;charset=utf-8" http-equiv="content-type" />
    <style>
        @font-face {
            font-family: "tttgbnumber";
            src: url("{{pluResPath}}/font/tttgbnumber.ttf");
        }

        @font-face {
            font-family: "NZBZ";
            src: url("{{pluResPath}}/font/NZBZ.TTF");
        }

        :root {
            --bg-cream: #f7f3e9;
            --gold-primary: #b8860b;
            --gold-light: #daa520;
            --gold-dark: #8b6914;
            --text-dark: #3a2f1e;
            --text-muted: #6b5e4a;
            --border-gold: #c9a959;
            --accent-purple: #8b5cf6;
            --rank-1: #ffd700;
            --rank-2: #c0c0c0;
            --rank-3: #cd7f32;
        }

        body {
            width: 500px;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #f7f3e9 0%, #ede7d9 100%);
            font-family: "NZBZ", "Microsoft YaHei", sans-serif;
            color: var(--text-dark);
        }

        .container {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(247, 243, 233, 0.9) 100%);
            border: 3px solid var(--border-gold);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(139, 105, 20, 0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-gold);
            padding-bottom: 15px;
        }

        .title {
            font-size: 32px;
            color: var(--gold-dark);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
            letter-spacing: 5px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.6);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e5dcc8;
        }

        .item:nth-child(1) {
            background: linear-gradient(90deg, #fff9db 0%, #fff 100%);
            border-color: var(--rank-1);
        }

        .item:nth-child(2) {
            background: linear-gradient(90deg, #f5f5f5 0%, #fff 100%);
            border-color: var(--rank-2);
        }

        .item:nth-child(3) {
            background: linear-gradient(90deg, #fff0e0 0%, #fff 100%);
            border-color: var(--rank-3);
        }

        .rank {
            width: 40px;
            font-size: 24px;
            font-family: "tttgbnumber";
            color: var(--text-muted);
            text-align: center;
            font-weight: bold;
        }

        .item:nth-child(1) .rank {
            color: var(--rank-1);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .item:nth-child(2) .rank {
            color: var(--rank-2);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .item:nth-child(3) .rank {
            color: var(--rank-3);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--gold-primary);
            margin: 0 15px;
        }

        .info {
            flex: 1;
        }

        .name {
            font-size: 18px;
            color: var(--text-dark);
            font-weight: bold;
        }

        .duanwei {
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.05);
            padding: 2px 6px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 2px;
        }

        .score {
            font-size: 20px;
            font-family: "tttgbnumber";
            color: var(--gold-dark);
            font-weight: bold;
            text-align: right;
            min-width: 80px;
        }

        .empty {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            font-size: 16px;
        }

        .footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 20px;
            border-top: 1px dashed var(--border-gold);
            padding-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <div class="title">赛季榜</div>
            <div class="subtitle">第{{season}}赛季 · 实时排名</div>
        </div>

        <div class="list">
            {{each leaderboard item index}}
            <div class="item">
                <div class="rank">{{item.rank}}</div>
                <img class="avatar" src="https://q1.qlogo.cn/g?b=qq&s=640&nk={{item.userId}}" />
                <div class="info">
                    <div class="name">{{item.name}}</div>
                    <div class="duanwei" style="color: {{item.duanwei.color}}">{{item.duanwei.name}}</div>
                </div>
                <div class="score">{{item.jifen}}</div>
            </div>
            {{/each}}

            {{if leaderboard.length == 0}}
            <div class="empty">暂无修士上榜，快来争夺第一吧！</div>
            {{/if}}
        </div>

        <div class="footer">
            本赛季将于周日 23:59 结算
        </div>
    </div>

</body>

</html>
