<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
            font-family: "HYWH";
            src: url("{{pluResPath}}font/HYWH-65W.ttf");
        }

        @font-face {
            font-family: "huawen";
            src: url("{{pluResPath}}font/华文中宋.TTF");
        }

        @font-face {
            font-family: "HYWenHei";
            src: url("{{pluResPath}}font/HYWenHei-55W.ttf");
        }

        @font-face {
      font-family: "tttgbnumber";
      src: url("{{pluResPath}}font/tttgbnumber.ttf");
    }

    @font-face {
            font-family: "HYWH";
            src: url("{{pluResPath}}font/HYWH-65W.ttf");
        }

        @font-face {
            font-family: "huawen";
            src: url("{{pluResPath}}font/华文中宋.TTF");
        }

        @font-face {
            font-family: "HYWenHei";
            src: url("{{pluResPath}}font/HYWenHei-55W.ttf");
        }

        @font-face {
      font-family: "NZBZ";
      src: url("{{pluResPath}}font/NZBZ.ttf");
    }

    body {
      margin: 0;
      padding: 0;
      width: fit-content;
    }

    #capture {
      padding: 30px;
      font-family: "NZBZ", "Microsoft YaHei", sans-serif;
      background: #0d0d0d;
      background-image: repeating-linear-gradient(45deg, #0d0d0d 0, #0d0d0d 10px, #1a0000 10px, #1a0000 12px);
      color: #e0e0e0;
      width: 700px;
    }

    .container {
      padding: 25px;
      background: rgba(20, 0, 0, 0.8);
      border: 2px solid #b71c1c;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(183, 28, 28, 0.2);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 1px solid #b71c1c;
      padding-bottom: 15px;
    }

    .title {
      font-size: 42px;
      font-weight: bold;
      color: #ff5252;
      text-shadow: 0 0 10px rgba(255, 82, 82, 0.6);
      letter-spacing: 4px;
    }

    .subtitle {
      font-size: 16px;
      color: #ff8a80;
      margin-top: 5px;
      font-family: "Microsoft YaHei";
    }

    .oath-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .oath-card {
      background: linear-gradient(135deg, rgba(40, 0, 0, 0.9) 0%, rgba(20, 0, 0, 0.9) 100%);
      border: 1px solid #5c0000;
      border-left: 4px solid #ff5252;
      border-radius: 6px;
      padding: 15px;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .oath-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 82, 82, 0.2);
      padding-bottom: 8px;
    }

    .oath-name {
      font-size: 24px;
      font-weight: bold;
      color: #ff5252;
      text-shadow: 0 0 5px rgba(255, 82, 82, 0.4);
    }

    .oath-profit {
      font-size: 16px;
      font-weight: bold;
      color: #69f0ae;
      background: rgba(0, 100, 0, 0.3);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #00c853;
      font-family: "tttgbnumber";
    }

    .oath-desc {
      font-size: 14px;
      color: #cfd8dc;
      line-height: 1.5;
      flex-grow: 1;
      text-align: justify;
      font-family: "Microsoft YaHei";
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      font-size: 14px;
      color: #7f8c8d;
      border-top: 1px dashed #5c0000;
      padding-top: 15px;
      font-family: "Microsoft YaHei";
    }

    .command-tip {
      color: #ffca28;
      font-weight: bold;
    }

    .warning-tip {
      color: #ef5350;
      margin-top: 10px;
      font-size: 14px;
      background: rgba(183, 28, 28, 0.1);
      display: inline-block;
      padding: 5px 15px;
      border-radius: 20px;
      border: 1px solid rgba(183, 28, 28, 0.3);
    }
  </style>
</head>

<body>
  <div id="capture">
    <div class="header">
      <div class="title">誓约之书</div>
      <div class="subtitle">立下誓约 · 挑战极限 · 逆天改命</div>
    </div>

    <div class="oath-list">
      {{each oaths o}}
      <div class="oath-card">
        <div class="oath-header">
          <div class="oath-name">【{{o.name}}】</div>
          <div class="oath-profit">收益 +{{o.profit_display}}</div>
        </div>
        <div class="oath-desc">{{o.desc}}</div>
      </div>
      {{/each}}
    </div>

    <div class="footer">
      <span class="command-tip">💡 使用方法：</span> 发送 <span class="command-tip">#开启试炼 [誓约名1] [誓约名2]...</span><br>
      例如：#开启试炼 孤行 贫苦<br>
      <div class="warning-tip">⚠️ 注意：不可只选择收益+0%的誓约开局</div>
    </div>
  </div>
  <script>
    (function () {
      const images = document.querySelectorAll('img');
      let loadedCount = 0;
      const totalImages = images.length;
      function checkAllLoaded() {
        loadedCount++;
        if (loadedCount >= totalImages) {
          document.getElementById('capture').classList.add('ready');
        }
      }
      if (totalImages === 0) {
        document.getElementById('capture').classList.add('ready');
      } else {
        images.forEach(img => {
          if (img.complete) checkAllLoaded();
          else {
            img.addEventListener('load', checkAllLoaded);
            img.addEventListener('error', checkAllLoaded);
          }
        });
      }
      setTimeout(() => { document.getElementById('capture').classList.add('ready'); }, 3000);
    })();
  </script>
</body>

</html>
