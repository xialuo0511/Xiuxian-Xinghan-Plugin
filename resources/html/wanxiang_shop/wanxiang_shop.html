<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
      @font-face {font-family: "tttgbnumber";src: url("file:///{{pluResPath}}/font/tttgbnumber.ttf");}
      @font-face {font-family: "NZBZ";src: url("file:///{{pluResPath}}/font/NZBZ.TTF");}

      :root {
          --bg-paper: #f4f0e6;
          --ink-color: #2c2c2c;
          --border-brown: #8c7b65;
          --gold: #b58900;
          --red: #c53828;
          --highlight-bg: #fffcf0;
      }

    body {
      margin: 0;
      padding: 30px;
      font-family: "NZBZ", "Microsoft YaHei", sans-serif;
      background: #e6e2d3;
      background-image: repeating-linear-gradient(45deg, #e6e2d3 0, #e6e2d3 10px, #e3dfd0 10px, #e3dfd0 12px);
      color: var(--ink-color);
      width: 700px;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 2px solid var(--border-brown);
      padding-bottom: 15px;
    }
    .title {
      font-size: 42px;
      font-weight: bold;
      color: var(--ink-color);
      text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
    }
    .currency {
      font-size: 24px;
      color: #27ae60;
      font-weight: bold;
      font-family: "tttgbnumber";
    }
    .shop-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .item-card {
      background: #fff;
      border: 1px solid var(--border-brown);
      border-radius: 6px;
      padding: 15px;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .item-card.locked {
      background: #e0e0e0;
      opacity: 0.8;
      border-color: #999;
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      align-items: flex-start;
    }
    .item-name {
      font-size: 22px;
      font-weight: bold;
      color: #3e2723;
    }
    .item-stock {
      font-size: 14px;
      color: #795548;
      font-family: "tttgbnumber";
      background: #efebe9;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .item-price {
      font-size: 20px;
      color: #f39c12;
      font-weight: bold;
      margin-bottom: 8px;
      font-family: "tttgbnumber";
    }
    .item-desc {
      font-size: 14px;
      color: #5d4037;
      line-height: 1.5;
      flex-grow: 1;
      font-family: "Microsoft YaHei";
    }
    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: #8d6e63;
      border-top: 1px dashed var(--border-brown);
      padding-top: 10px;
      font-family: "Microsoft YaHei";
    }
    .cmd { color: #c0392b; font-weight: bold; font-family: "NZBZ"; font-size: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">天机阁</div>
      <div class="currency">持有天机玉: {{jade}}</div>
    </div>
    
    <div class="shop-list">
      {{each items item}}
      <div class="item-card {{if item.locked}}locked{{/if}}">
        <div class="item-header">
          <div class="item-name">{{item.name}}</div>
          <div class="item-stock">
             {{if item.limit === -1}}无限{{else}}剩余: {{item.stock}}{{/if}}
          </div>
        </div>
        <div class="item-price">💰 {{item.price}} 天机玉</div>
        <div class="item-desc">{{if item.locked}}🔒 前置商品未兑换完{{else}}兑换 {{item.name}}{{/if}}</div>
      </div>
      {{/each}}
    </div>

    <div class="footer">
      发送 <span class="cmd">#兑换 [商品名] [数量]</span> 进行兑换 (如: #兑换 灵石 1)
    </div>
  </div>
</body>
</html>
