<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
      @font-face {font-family: "tttgbnumber";src: url("file:///{{pluResPath}}/font/tttgbnumber.ttf");}
      @font-face {font-family: "NZBZ";src: url("file:///{{pluResPath}}/font/NZBZ.TTF");}

      :root {
          --bg-dark: #121212;
          --border-gold: #d4af37;
          --text-main: #e0e0e0;
          --text-sub: #a0a0a0;
          --gold: #ffd700;
          --green: #69f0ae;
          --red: #ff5252;
      }
      
      * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 30px;
      font-family: "NZBZ", "Microsoft YaHei", sans-serif;
      background: #000;
      background-image: radial-gradient(circle at 50% 10%, #222 0%, #000 100%);
      color: var(--text-main);
      width: 700px;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      border: 2px solid var(--border-gold);
      border-radius: 12px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.02);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.1);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding-bottom: 15px;
    }
    .title {
      font-size: 42px;
      font-weight: bold;
      background: linear-gradient(to bottom, #fff 0%, #ffd700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5));
    }
    .currency {
      font-size: 24px;
      color: var(--green);
      font-weight: bold;
      font-family: "tttgbnumber";
      text-shadow: 0 0 5px rgba(105, 240, 174, 0.4);
    }
    .shop-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .item-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 15px;
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .item-card:not(.locked):hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        border-color: rgba(212, 175, 55, 0.5);
    }

    .item-card.locked {
      background: rgba(0, 0, 0, 0.3);
      opacity: 0.6;
      border: 1px dashed #555;
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      align-items: flex-start;
      gap: 10px;
    }
    .item-name {
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      word-break: break-all;
      line-height: 1.2;
    }
    .locked .item-name { color: #888; }
    
    .item-stock {
      font-size: 14px;
      color: #000;
      font-family: "tttgbnumber";
      background: var(--gold);
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
      font-weight: bold;
    }
    .locked .item-stock { background: #555; color: #ccc; }

    .item-price {
      font-size: 20px;
      color: var(--gold);
      font-weight: bold;
      margin-bottom: 8px;
      font-family: "tttgbnumber";
    }
    .item-desc {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.5;
      flex-grow: 1;
      font-family: "Microsoft YaHei";
    }
    
    .footer {
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
      color: #666;
      border-top: 1px dashed #444;
      padding-top: 15px;
      font-family: "Microsoft YaHei";
    }
    .cmd { color: var(--gold); font-weight: bold; font-family: "NZBZ"; font-size: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">天机阁</div>
      <div class="currency">持有天机玉: {{jade}}</div>
    </div>
    
    <div class="shop-list">
      {{each items item}}
      <div class="item-card {{if item.locked}}locked{{/if}}">
        <div class="item-header">
          <div class="item-name">{{item.name}}</div>
          <div class="item-stock">
             {{if item.limit === -1}}无限{{else}}剩余: {{item.stock}}{{/if}}
          </div>
        </div>
        <div class="item-price">💰 {{item.price}} 天机玉</div>
        <div class="item-desc">{{if item.locked}}🔒 前置商品未兑换完{{else}}兑换 {{item.name}}{{/if}}</div>
      </div>
      {{/each}}
    </div>

    <div class="footer">
      发送 <span class="cmd">#兑换 [商品名] [数量]</span> 进行兑换 (如: #兑换 灵石 1)
    </div>
  </div>
</body>
</html>
