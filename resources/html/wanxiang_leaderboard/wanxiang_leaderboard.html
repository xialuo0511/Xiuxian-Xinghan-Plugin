<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Microsoft YaHei", sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      width: 600px;
    }
    .container {
      padding: 20px;
      background: linear-gradient(180deg, #2c3e50 0%, #000000 100%);
      border: 2px solid #d4af37;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #d4af37;
      padding-bottom: 10px;
    }
    .title {
      font-size: 32px;
      font-weight: bold;
      color: #f1c40f;
      text-shadow: 2px 2px 4px #000;
    }
    .subtitle {
      font-size: 14px;
      color: #95a5a6;
      margin-top: 5px;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .row {
      display: flex;
      align-items: center;
      background-color: rgba(52, 73, 94, 0.8);
      padding: 10px 15px;
      border-radius: 6px;
      border: 1px solid #7f8c8d;
    }
    .row:nth-child(1) { background: linear-gradient(90deg, #e67e22, #f1c40f); border-color: #f1c40f; }
    .row:nth-child(2) { background: linear-gradient(90deg, #7f8c8d, #bdc3c7); border-color: #bdc3c7; }
    .row:nth-child(3) { background: linear-gradient(90deg, #d35400, #e67e22); border-color: #d35400; }
    
    .rank {
      width: 40px;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      margin-right: 15px;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
    }
    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #ccc;
      margin-right: 15px;
      border: 2px solid #fff;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; }
    .info {
      flex: 1;
    }
    .name {
      font-size: 18px;
      font-weight: bold;
    }
    .score {
      font-size: 20px;
      font-weight: bold;
      color: #2ecc71;
      text-align: right;
    }
    .row:nth-child(1) .score, .row:nth-child(2) .score, .row:nth-child(3) .score {
        color: #fff; text-shadow: 1px 1px 2px #000;
    }
    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #7f8c8d;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">天机风云榜</div>
      <div class="subtitle">每周一上午10:00结算奖励</div>
      {{if remainingTime}}
      <div style="margin-top:5px; color:#2ecc71; font-weight:bold; font-size: 14px;">距离结算还剩：{{remainingTime}}</div>
      {{/if}}
    </div>
    
    <div class="list">
      {{if list.length == 0}}
      <div style="text-align:center; padding:20px; color:#999;">暂无数据</div>
      {{else}}
        {{each list item i}}
        <div class="row">
          <div class="rank">{{item.rank}}</div>
          <div class="avatar"><img src="{{item.avatar}}" /></div>
          <div class="info">
            <div class="name">{{item.name}}</div>
          </div>
          <div style="text-align: right;">
             <div class="score">{{item.score}} 玉</div>
             {{if item.reward > 0}}
             <div style="font-size: 15px; color: #ffeb3b; font-weight: bold; margin-top:4px; text-shadow: 1px 1px 2px #000;">🏆 预期奖励: {{item.reward}}</div>
             {{/if}}
          </div>
        </div>
        {{/each}}
      {{/if}}
    </div>

    <div class="footer">
      仅展示本周获得过天机玉的前 20 名修士
    </div>
  </div>
</body>
</html>
