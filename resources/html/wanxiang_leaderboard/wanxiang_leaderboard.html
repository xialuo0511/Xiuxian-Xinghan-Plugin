<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: "tttgbnumber";
      src: url("file:///{{pluResPath}}/font/tttgbnumber.ttf");
    }

    @font-face {
      font-family: "NZBZ";
      src: url("file:///{{pluResPath}}/font/NZBZ.TTF");
    }

    :root {
      --bg-dark: #121212;
      --text-main: #e0e0e0;
      --text-sub: #a0a0a0;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
    }

    body {
      margin: 0;
      padding: 0;
      width: fit-content;
    }

    #capture {
      padding: 30px;
      font-family: "NZBZ", "Microsoft YaHei", sans-serif;
      background: #000;
      background-image: radial-gradient(circle at 50% 0%, #2a2a2a 0%, #000 100%);
      color: var(--text-main);
      width: 600px;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.02);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
    }

    .header {
      text-align: center;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding-bottom: 15px;
    }

    .title {
      font-size: 42px;
      font-weight: bold;
      background: linear-gradient(to bottom, #fff 0%, #ffd700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5));
    }

    .subtitle {
      font-size: 16px;
      color: var(--text-sub);
      margin-top: 5px;
      font-family: "Microsoft YaHei";
    }

    .remaining-time {
      margin-top: 8px;
      color: #69f0ae;
      font-weight: bold;
      font-size: 16px;
      font-family: 'tttgbnumber';
      text-shadow: 0 0 5px rgba(105, 240, 174, 0.4);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.2s;
    }

    /* Top 3 Styles */
    .row:nth-child(1) {
      background: linear-gradient(90deg, rgba(255, 215, 0, 0.1), transparent);
      border: 1px solid var(--gold);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    .row:nth-child(2) {
      background: linear-gradient(90deg, rgba(192, 192, 192, 0.1), transparent);
      border: 1px solid var(--silver);
    }

    .row:nth-child(3) {
      background: linear-gradient(90deg, rgba(205, 127, 50, 0.1), transparent);
      border: 1px solid var(--bronze);
    }

    .rank {
      width: 40px;
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      margin-right: 15px;
      font-family: "tttgbnumber";
      color: #555;
    }

    .row:nth-child(1) .rank {
      color: var(--gold);
      text-shadow: 0 0 5px var(--gold);
    }

    .row:nth-child(2) .rank {
      color: var(--silver);
      text-shadow: 0 0 5px var(--silver);
    }

    .row:nth-child(3) .rank {
      color: var(--bronze);
      text-shadow: 0 0 5px var(--bronze);
    }

    .row:nth-child(n+4) .rank {
      color: #888;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #333;
      margin-right: 15px;
      border: 2px solid #555;
      overflow: hidden;
    }

    .row:nth-child(1) .avatar {
      border-color: var(--gold);
    }

    .row:nth-child(2) .avatar {
      border-color: var(--silver);
    }

    .row:nth-child(3) .avatar {
      border-color: var(--bronze);
    }

    .avatar img {
      width: 100%;
      height: 100%;
    }

    .info {
      flex: 1;
    }

    .name {
      font-size: 20px;
      font-weight: bold;
      color: #fff;
    }

    .score-container {
      text-align: right;
    }

    .score {
      font-size: 24px;
      font-weight: bold;
      color: #69f0ae;
      font-family: "tttgbnumber";
    }

    .reward {
      font-size: 14px;
      color: var(--gold);
      margin-top: 4px;
      font-family: 'tttgbnumber';
    }

    .footer {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #666;
      border-top: 1px dashed #444;
      padding-top: 10px;
      font-family: "Microsoft YaHei";
    }
  </style>
</head>

<body>
  <div id="capture">
    <div class="header">
      <div class="title">天机风云榜</div>
      <div class="subtitle">每周一上午10:00结算奖励</div>
      {{if remainingTime}}
      <div class="remaining-time">距离结算还剩：{{remainingTime}}</div>
      {{/if}}
    </div>

    <div class="list">
      {{if list.length == 0}}
      <div style="text-align:center; padding:30px; color:#666; font-size: 18px;">暂无数据</div>
      {{else}}
      {{each list item i}}
      <div class="row">
        <div class="rank">{{item.rank}}</div>
        <div class="avatar"><img src="{{item.avatar}}" /></div>
        <div class="info">
          <div class="name">{{item.name}}</div>
        </div>
        <div class="score-container">
          <div class="score">{{item.score}}</div>
          {{if item.reward > 0}}
          <div class="reward">🏆 预期: {{item.reward}}</div>
          {{/if}}
        </div>
      </div>
      {{/each}}
      {{/if}}
    </div>

    <div class="footer">
      仅展示本周获得过天机玉的前 20 名修士
    </div>
  </div>
  <script>
    (function () {
      const images = document.querySelectorAll('img');
      let loadedCount = 0;
      const totalImages = images.length;
      function checkAllLoaded() {
        loadedCount++;
        if (loadedCount >= totalImages) {
          document.getElementById('capture').classList.add('ready');
        }
      }
      if (totalImages === 0) {
        document.getElementById('capture').classList.add('ready');
      } else {
        images.forEach(img => {
          if (img.complete) checkAllLoaded();
          else {
            img.addEventListener('load', checkAllLoaded);
            img.addEventListener('error', checkAllLoaded);
          }
        });
      }
      setTimeout(() => { document.getElementById('capture').classList.add('ready'); }, 3000);
    })();
  </script>
</body>

</html>
