<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: "tttgbnumber";
      src: url("{{pluResPath}}font/tttgbnumber.ttf");
    }

    @font-face {
      font-family: "NZBZ";
      src: url("{{pluResPath}}font/NZBZ.TTF");
    }

    body {
      margin: 0;
      padding: 0;
      width: fit-content;
    }

    #capture {
      padding: 30px;
      font-family: "NZBZ", "Microsoft YaHei", sans-serif;
      background: #000;
      background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%);
      color: #fff;
      width: 650px;
    }

    .container {
      padding: 20px;
      background: rgba(255, 255, 255, 0.02);
      border: 2px solid #00bcd4;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 188, 212, 0.2);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 1px solid #00bcd4;
      padding-bottom: 15px;
    }

    .title {
      font-size: 42px;
      font-weight: bold;
      color: #00e5ff;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
      letter-spacing: 2px;
    }

    .currency {
      text-align: right;
      font-size: 18px;
      color: #fff;
      margin-bottom: 25px;
      background: rgba(0, 188, 212, 0.1);
      padding: 8px 15px;
      border-radius: 8px;
      display: inline-block;
      border: 1px solid rgba(0, 188, 212, 0.3);
      float: right;
    }

    .clearfix::after {
      content: "";
      display: table;
      clear: both;
    }

    .tree {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      position: relative;
      margin-top: 10px;
    }

    .node {
      background: rgba(30, 30, 30, 0.9);
      border: 2px solid #555;
      border-radius: 8px;
      padding: 15px 20px;
      width: 85%;
      text-align: left;
      position: relative;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .node.unlocked {
      background: linear-gradient(90deg, rgba(0, 188, 212, 0.1), transparent);
      border-color: #00bcd4;
      box-shadow: 0 0 15px rgba(0, 188, 212, 0.2);
    }

    .node.next {
      background: linear-gradient(90deg, rgba(255, 193, 7, 0.1), transparent);
      border-color: #ffc107;
      box-shadow: 0 0 15px rgba(255, 193, 7, 0.2);
    }

    .node.locked {
      background: rgba(0, 0, 0, 0.5);
      border-color: #333;
      opacity: 0.7;
    }

    .node-content {
      flex: 1;
    }

    .name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #e0e0e0;
    }

    .unlocked .name {
      color: #00e5ff;
      text-shadow: 0 0 5px rgba(0, 229, 255, 0.4);
    }

    .next .name {
      color: #ffca28;
      text-shadow: 0 0 5px rgba(255, 202, 40, 0.4);
    }

    .desc {
      font-size: 14px;
      color: #9e9e9e;
      font-family: "Microsoft YaHei";
    }

    .status-badge {
      font-size: 14px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 4px;
      min-width: 80px;
      text-align: center;
      font-family: "tttgbnumber";
    }

    .unlocked .status-badge {
      color: #00bcd4;
      border: 1px solid #00bcd4;
    }

    .next .status-badge {
      color: #ffc107;
      border: 1px solid #ffc107;
      background: rgba(255, 193, 7, 0.1);
    }

    .locked .status-badge {
      color: #555;
      border: 1px solid #555;
    }

    .cost {
      font-size: 14px;
      color: #ffca28;
      margin-top: 5px;
      font-family: "tttgbnumber";
    }

    .arrow {
      font-size: 24px;
      color: #333;
      line-height: 1;
      height: 24px;
    }

    .unlocked+.arrow {
      color: #00bcd4;
      text-shadow: 0 0 5px #00bcd4;
    }

    .next+.arrow {
      color: #ffc107;
      text-shadow: 0 0 5px #ffc107;
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      font-size: 14px;
      color: #607d8b;
      border-top: 1px dashed #37474f;
      padding-top: 15px;
      font-family: "Microsoft YaHei";
    }

    .cmd {
      color: #00bcd4;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="capture">
    <div class="header">
      <div class="title">天机秘术</div>
    </div>

    <div class="clearfix">
      <div class="currency">
        天机玉: <span
          style="font-size: 24px; font-weight: bold; font-family: 'tttgbnumber'; color: #00e5ff;">{{jade}}</span>
      </div>
    </div>

    <div class="tree">
      {{each upgrades u index}}
      <div class="node {{u.status}}">
        <div class="node-content">
          <div class="name">{{u.name}}</div>
          <div class="desc">{{u.desc}}</div>
          {{if u.status == 'next'}}
          <div class="cost">▲ 升级消耗: {{u.cost}} 玉</div>
          {{/if}}
        </div>
        <div class="status-badge">
          {{if u.status == 'unlocked'}}已激活{{else if u.status == 'next'}}待解锁{{else}}未解锁{{/if}}
        </div>
      </div>

      {{if index < upgrades.length - 1}} <div class="arrow">⬇
    </div>
    {{/if}}
    {{/each}}
  </div>

  <div class="footer">
    发送 <span class="cmd">#强化天机秘术</span> 解锁下一级，获得永久增益
  </div>
  </div>
  <script>
    (function () {
      const images = document.querySelectorAll('img');
      let loadedCount = 0;
      const totalImages = images.length;
      function checkAllLoaded() {
        loadedCount++;
        if (loadedCount >= totalImages) {
          document.getElementById('capture').classList.add('ready');
        }
      }
      if (totalImages === 0) {
        document.getElementById('capture').classList.add('ready');
      } else {
        images.forEach(img => {
          if (img.complete) checkAllLoaded();
          else {
            img.addEventListener('load', checkAllLoaded);
            img.addEventListener('error', checkAllLoaded);
          }
        });
      }
      setTimeout(() => { document.getElementById('capture').classList.add('ready'); }, 3000);
    })();
  </script>
</body>

</html>
