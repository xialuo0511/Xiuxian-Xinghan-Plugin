<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Microsoft YaHei", sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      width: 600px;
    }
    .container {
      padding: 20px;
      background: linear-gradient(180deg, #2c3e50 0%, #000000 100%);
      border: 2px solid #d4af37;
      border-radius: 10px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #d4af37;
      padding-bottom: 10px;
    }
    .title {
      font-size: 32px;
      font-weight: bold;
      color: #f1c40f;
      text-shadow: 2px 2px 4px #000;
    }
    .currency {
      text-align: right;
      font-size: 18px;
      color: #2ecc71;
      margin-bottom: 20px;
    }
    .tree {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      position: relative;
    }
    .node {
      background-color: #34495e;
      border: 2px solid #7f8c8d;
      border-radius: 8px;
      padding: 15px;
      width: 80%;
      text-align: center;
      position: relative;
      transition: all 0.3s;
    }
    .node.unlocked {
      background-color: #27ae60;
      border-color: #2ecc71;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
    }
    .node.next {
      background-color: #e67e22;
      border-color: #f39c12;
      box-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
    }
    .node.locked {
      background-color: #2c3e50;
      opacity: 0.6;
    }
    .name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .desc {
      font-size: 14px;
      color: #bdc3c7;
    }
    .cost {
      font-size: 14px;
      color: #f1c40f;
      margin-top: 5px;
    }
    .arrow {
      font-size: 24px;
      color: #7f8c8d;
    }
    .unlocked + .arrow {
      color: #2ecc71;
    }
    .next + .arrow {
      color: #f39c12;
    }
    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: #95a5a6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">天机秘术</div>
    </div>
    <div class="currency">
      当前持有天机玉: <span style="font-size: 24px; font-weight: bold;">{{jade}}</span>
    </div>
    
    <div class="tree">
      {{#upgrades}}
      <div class="node {{status}}">
        <div class="name">{{name}} {{#if (eq status "unlocked")}}[已激活]{{/if}}</div>
        <div class="desc">{{desc}}</div>
        {{#if (eq status "next")}}
        <div class="cost">消耗: {{cost}} 天机玉</div>
        {{/if}}
        {{#if (eq status "locked")}}
        <div class="cost">前置未解锁</div>
        {{/if}}
      </div>
      {{#unless @last}}
      <div class="arrow">⬇</div>
      {{/unless}}
      {{/upgrades}}
    </div>

    <div class="footer">
      发送 #强化天机秘术 解锁下一级
    </div>
  </div>
</body>
</html>
