<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
      @font-face {
          font-family: "tttgbnumber";
          src: url("file:///{{pluResPath}}/font/tttgbnumber.ttf");
      }

      @font-face {
          font-family: "NZBZ";
          src: url("file:///{{pluResPath}}/font/NZBZ.ttf");
      }

      body {
          width: 600px;
          margin: 0;
          padding: 20px;
          background-color: #e6e2d3;
          background-image: repeating-linear-gradient(45deg, #e6e2d3 0, #e6e2d3 10px, #e3dfd0 10px, #e3dfd0 12px);
          font-family: "NZBZ", sans-serif;
          color: #4a2c1a;
      }

      .container {
          display: flex;
          flex-direction: column;
          gap: 15px;
      }

      .card-base {
          background: rgba(253, 250, 245, 0.88);
          backdrop-filter: blur(8px);
          -webkit-backdrop-filter: blur(8px);
          border: 2px solid #a88763;
          border-radius: 12px;
          box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
          padding: 20px;
      }

      .header {
          text-align: center;
          border-bottom: 1px solid #d2b48c;
          padding-bottom: 10px;
          margin-bottom: 15px;
      }

      .title-main {
          font-size: 36px;
          color: #6a3906;
          font-weight: bold;
      }

      .current-title-section {
          text-align: center;
          margin-bottom: 10px;
      }

      .label-sm {
          font-size: 16px;
          color: #7a5533;
          margin-bottom: 5px;
      }

      .current-title-display {
          font-size: 32px;
          font-weight: bold;
          background: linear-gradient(to bottom, #ffffff 0%, #ffd700 50%, #ff8c00 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 8px rgba(255, 215, 0, 0.6));
          letter-spacing: 4px;
          padding: 5px 0;
      }

      .no-title {
          font-size: 24px;
          color: #999;
          font-style: italic;
      }

      .section-title {
          font-size: 20px;
          color: #6a3906;
          border-bottom: 1px solid #d2b48c;
          padding-bottom: 5px;
          margin: 10px 0;
          text-align: center;
      }

      .title-list {
          display: flex;
          flex-direction: column;
          gap: 12px;
      }

      .title-item {
          background: rgba(255, 255, 255, 0.4);
          border: 1px solid rgba(168, 135, 99, 0.3);
          border-radius: 8px;
          padding: 12px 15px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          position: relative;
      }

      .title-item.equipped {
          border: 2px solid #d4af37;
          background: rgba(255, 215, 0, 0.05);
      }

      .title-item.locked {
          filter: grayscale(1);
          opacity: 0.7;
      }

      .title-info {
          flex: 1;
      }

      .title-name {
          font-size: 24px;
          font-weight: bold;
          color: #6a3906;
          margin-bottom: 4px;
      }
      
      /* 万象至尊专属金色文字 */
      .name-special {
          background: linear-gradient(to bottom, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          font-weight: bold;
      }

      .title-desc {
          font-size: 14px;
          color: #7a5533;
          font-family: sans-serif;
      }

      .title-status {
          text-align: right;
          margin-left: 15px;
      }

      .badge {
          font-size: 12px;
          padding: 2px 8px;
          border-radius: 4px;
          font-family: sans-serif;
          font-weight: bold;
      }

      .badge-equipped { background: #d4af37; color: #fff; }
      .badge-unlocked { color: #2e7d32; border: 1px solid #2e7d32; }
      .badge-locked { color: #757575; border: 1px solid #757575; }

      .footer {
          text-align: center;
          font-size: 12px;
          color: #8c6f4d;
          margin-top: 10px;
      }
      .cmd-hint { color: #c53828; font-weight: bold; }
  </style>
</head>
<body>
<div class="container">
  <div class="card-base">
    <div class="header">
      <div class="title-main">称号图鉴</div>
    </div>

    <div class="current-title-section">
      <div class="label-sm">—— 当前佩戴 ——</div>
      {{if currentTitle}}
      <div class="current-title-display">{{currentTitle}}</div>
      {{else}}
      <div class="no-title">暂无佩戴</div>
      {{/if}}
    </div>

    <div class="section-title">收录称号</div>
    
    <div class="title-list">
      {{each titles t}}
      <div class="title-item {{if t.isEquipped}}equipped{{else if !t.isUnlocked}}locked{{/if}}">
        <div class="title-info">
          <div class="title-name {{if t.name == '万象至尊'}}name-special{{/if}}">{{t.name}}</div>
          <div class="title-desc">
            {{if t.isUnlocked}}
              {{t.desc}}
            {{else}}
              获取方式：{{t.desc}}
            {{/if}}
          </div>
        </div>
        <div class="title-status">
          {{if t.isEquipped}}
          <span class="badge badge-equipped">已佩戴</span>
          {{else if t.isUnlocked}}
          <span class="badge badge-unlocked">已解锁</span>
          {{else}}
          <span class="badge badge-locked">未解锁</span>
          {{/if}}
        </div>
      </div>
      {{/each}}
    </div>
  </div>

  <div class="footer">
    使用 <span class="cmd-hint">#切换称号 [称号名]</span> 进行佩戴
  </div>
</div>
</body>
</html>
