<!DOCTYPE html>
<html>
<head>
  <meta content="text/html;charset=utf-8" http-equiv="content-type" />
  <link href="#" rel="shortcut icon" />
  <style type="text/css">
      @font-face {
            font-family: "HYWenHei";
            src: url("{{pluResPath}}font/HYWenHei-55W.ttf");
        }

        @font-face {
          font-family: "tttgbnumber";
          src: url("{{pluResPath}}font/tttgbnumber.ttf");
      }

      @font-face {
            font-family: "HYWenHei";
            src: url("{{pluResPath}}font/HYWenHei-55W.ttf");
        }

        @font-face {
          font-family: "NZBZ";
          src: url("{{pluResPath}}font/NZBZ.TTF");
      }

      body {
          width: 800px;
          margin: 0;
          padding: 20px;
          background-size: cover;
          background-position: center;
          font-family: "tttgbnumber", "HYWenHei", "Microsoft YaHei", sans-serif;
          color: #4a2c1a;
      }

      .panel-container {
          background: rgba(253, 250, 245, 0.9);
          backdrop-filter: blur(8px);
          -webkit-backdrop-filter: blur(8px);
          border: 2px solid #a88763;
          border-radius: 15px;
          box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
          padding: 20px;
      }

      .header {
          text-align: center;
          padding-bottom: 15px;
          border-bottom: 2px dashed #d2b48c;
          margin-bottom: 20px;
      }

      .main-title {
          font-family: "NZBZ", "HYWenHei", "Microsoft YaHei", sans-serif;
          font-size: 42px;
          color: #6a3906;
          text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.2);
      }

      .sub-title {
          font-size: 16px;
          color: #7a5533;
          margin-top: 5px;
      }

      .content-container {

      }

      .place-card {
          background: rgba(255, 255, 255, 0.4);
          border: 1px solid #d2b48c;
          border-radius: 10px;
          margin-bottom: 15px;
          padding: 15px;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .place-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-bottom: 1px solid #d2b48c;
          padding-bottom: 10px;
          margin-bottom: 10px;
      }

      .place-name {
          font-family: "NZBZ", "HYWenHei", "Microsoft YaHei", sans-serif;
          font-size: 24px;
          color: #6a3906;
      }

      .place-grade {
          font-size: 16px;
          color: #8B4513;
      }

      .place-price {
          font-size: 18px;
          font-weight: bold;
          background: #a88763;
          color: white;
          padding: 5px 10px;
          border-radius: 5px;
      }

      .loot-section {
          display: flex;
          flex-direction: column;
          gap: 8px;
      }

      .loot-tier {
          display: flex;
          align-items: flex-start;
      }

      .loot-label {
          font-weight: bold;
          font-size: 16px;
          color: #7a5533;
          width: 80px;
          flex-shrink: 0;
      }

      .loot-items {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
      }

      .loot-item {
          background: rgba(255, 255, 255, 0.5);
          padding: 4px 8px;
          border-radius: 4px;
          font-size: 14px;
          border: 1px solid #d2b48c;
      }

  </style>
</head>
<body>
<div class="panel-container" id="capture">
  <div class="header">
    <div class="main-title">{{addres}}列表</div>
    <div class="sub-title">降临指令: #降临{{addres}}+地点名</div>
  </div>

  <div class="content-container">
    {{each didian_list item}}
    <div class="place-card">
      <div class="place-header">
        <div>
          <span class="place-grade">【{{item.Grade}}】</span>
          <span class="place-name">{{item.name}}</span>
        </div>
        <div class="place-price">{{item.Price}} 灵石</div>
      </div>
      <div class="loot-section">
        <div class="loot-tier">
          <span class="loot-label">低级奖励:</span>
          <div class="loot-items">
            {{each item.one thing}}
            <div class="loot-item">{{thing.name}}</div>
            {{/each}}
          </div>
        </div>
        <div class="loot-tier">
          <span class="loot-label">中级奖励:</span>
          <div class="loot-items">
            {{each item.two thing}}
            <div class="loot-item">{{thing.name}}</div>
            {{/each}}
          </div>
        </div>
        <div class="loot-tier">
          <span class="loot-label">高级奖励:</span>
          <div class="loot-items">
            {{each item.three thing}}
            <div class="loot-item">{{thing.name}}</div>
            {{/each}}
          </div>
        </div>
      </div>
    </div>
    {{/each}}
  </div>
</div>
</body>
</html>
